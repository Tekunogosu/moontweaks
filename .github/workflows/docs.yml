name: docs

# The reference is generated from the mod's bindings, so it is rebuilt from
# source rather than committed. A binding without documentation fails the job, and
# so does an example that disagrees with the types that binding produced.
# Both names are listed because the branch this publishes from is whichever one the
# repository calls its default; the deploy steps check that rather than a name, so a
# push to the other one is built and checked without publishing anything.
on:
  push:
    branches: [main, omega]
  pull_request:

permissions:
  contents: read

# One deploy at a time, and a queued one waits rather than cancelling the running
# one: a half-published site is worse than a late one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Fetch Vintage Story
        run: |
          mkdir -p "$HOME/vs"
          curl -sSfL "https://cdn.vintagestory.at/gamefiles/stable/vs_server_linux-x64_${VS_VERSION}.tar.gz" \
            | tar -xz -C "$HOME/vs"
          echo "VINTAGE_STORY=$HOME/vs" >> "$GITHUB_ENV"
        env:
          VS_VERSION: 1.22.7

      - name: Fetch lua-language-server
        run: |
          mkdir -p "$HOME/lua-ls"
          curl -sSfL "https://github.com/LuaLS/lua-language-server/releases/download/${LUA_LS_VERSION}/lua-language-server-${LUA_LS_VERSION}-linux-x64.tar.gz" \
            | tar -xz -C "$HOME/lua-ls"
          echo "$HOME/lua-ls/bin" >> "$GITHUB_PATH"
        env:
          LUA_LS_VERSION: 3.19.1

      - run: ./scripts/package.sh

      # Fails on an engine recording a value the checks do not already account for.
      # Timings are reported and never fail.
      - name: Check the script engine
        run: ./scripts/bench.sh --quick

      - run: ./scripts/docs.sh --check
      - run: ./scripts/docs.sh

      # docs.sh writes the diagnostics checklist from the bindings. The generated
      # file is committed, so a binding added without regenerating it would leave the
      # suite measuring coverage against a list that no longer names every function.
      # Regenerating here would hide that; comparing is what surfaces it.
      - name: Check the diagnostics checklist is current
        run: git diff --exit-code examples/scripts/diagnostics/01-surface.lua

      # docs.sh scaffolds examples/ with this build's library, so the check runs
      # against the types this commit generates rather than a checked-in copy. It is
      # a step of its own rather than part of package.sh: a diagnostic in an example
      # is a finding about the examples, and a build step failing on it reports the
      # packaging as broken instead.
      - name: Check the examples against the generated types
        run: ./scripts/check-examples.sh

      # Only the default branch is published, so every other build checks the
      # reference without producing an artifact nothing will deploy.
      - uses: actions/upload-pages-artifact@v5
        if: github.ref_name == github.event.repository.default_branch
        with:
          path: docs

  deploy:
    if: github.ref_name == github.event.repository.default_branch
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
